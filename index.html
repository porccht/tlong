<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOTOBOOTH - Thanh Long ❤️‍🩹</title>
    <style>
        /* ==========================================
           1. CẤU HÌNH NỀN VÀ PHÔNG CHỮ TOÀN TRANG
           ========================================== */
        * {
            box-sizing: border-box;
        }

        body {
            /* Nền Liquid Glass tươi sáng, đa sắc nhưng dễ nhìn */
            background: #181c2b;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.35) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.35) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(168, 85, 247, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
        }

        /* ==========================================
           2. ANIMATION CHỮ & TIÊU ĐỀ
           ========================================== */
        h1 {
            margin-top: 10px;
            margin-bottom: 8px;
            font-size: 2.2rem;
            font-weight: 700;
            /* Giữ chữ Thanh Long ❤️‍🩹 màu trắng sáng rõ mặc định */
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .subtitle {
            color: #ffccc7;
            font-size: 0.9rem;
            margin-bottom: 25px;
            opacity: 0.9;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
        }

        .subtitle-warning {
            display: inline-block;
            background: rgba(255, 204, 199, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 204, 199, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            color: #ffccc7;
            font-size: 0.9rem;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }

        /* ==========================================
           3. KHUNG CHỨA (GALLERY) & LIQUID GLASS CARDS
           ========================================== */
        #gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            gap: 35px;
        }

        /* Thẻ Kính Mờ Liquid Glass Tươi Sáng & Nổi Bật */
        .image-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 24px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.25),
                inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.35s ease;
            animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .image-block:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        }

        /* ==========================================
           4. ĐỊNH DẠNG HÌNH ẢNH & VIDEO
           ========================================== */
        img, video {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 16px;
            border: 2px solid #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
            background-color: #1a1a1a;
            object-fit: contain;
        }

        img:hover, video:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        /* ==========================================
           5. NÚT ẤN MỚI BO TRÒN (LIQUID BUTTON)
           ========================================== */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #007bff, #00d2ff);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.35);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #0056b3, #00aaff);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.55);
        }

        .download-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* ==========================================
           6. ANIMATIONS KEYFRAMES
           ========================================== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <h1>Bộ Sưu Tập Của Thanh Long ❤️‍🩹</h1>
    <div class="subtitle">Thanh Long ❤️‍🩹 code và sửa lại</div>
    <div class="subtitle subtitle-warning">⚠️ Ảnh đã chụp vào Thứ 5 15:47 22/10/2026 ⚠️</div>
    
    <div id="gallery">

        <!-- 1. HÌNH ẢNH ĐƠN -->
        <div class="image-block">

            <a href="https://cdn.jsdelivr.net/gh/porccht/tlong@main/dulieu/video.mp4" download="video.mp4" class="download-btn">📥 Tải xuống video</a>
        </div>

        <!-- 4. VIDEO GIF -->
        <div class="image-block">

        </div>

        <!-- 5. CÁC ẢNH KHÁC -->
        <div class="image-block">
            <img src="https://cdn.jsdelivr.net/gh/porccht/tlong@main/dulieu/1.png" alt="Ảnh 1">

        <div class="image-block">

        <div class="image-block">
            <img src="https://cdn.jsdelivr.net/gh/porccht/tlong@main/dulieu/3.png" alt="Ảnh 3">
            <a href="https://cdn.jsdelivr.net/gh/porccht/tlong@main/dulieu/3.png" download="3.png" class="download-btn">📥 Tải xuống</a>
        </div>
        <div class="image-block">
            <img src="https://cdn.jsdelivr.net/gh/porccht/tlong@main/dulieu/4.png" alt="Ảnh 4">

        </div>

    </div>

</body>
</html>
